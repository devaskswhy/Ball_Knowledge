databases:
  - name: ball-knowledge-db
    plan: free
    databaseName: ballknowledge
    user: ballknowledge

services:
  - type: web
    name: ball-knowledge-api
    env: python
    plan: free
    buildCommand: "pip install -r requirements.txt && alembic upgrade head"
    startCommand: "uvicorn services.api:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        fromDatabase:
          name: ball-knowledge-db
          property: connectionString
      # Set in the Render dashboard - never committed to the repo.
      - key: API_SPORTS_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
